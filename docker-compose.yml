name: hello-solid

services:
  app:
    build: .
    image: hello-solid-app
    ports:
      - "${PB_PUBLISH_PORT:-8090}:8090"
    user: "${UID:-1000}:${GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    environment:
      PB_PORT: 8090
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:?required}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:?required}
      PB_TESTUSER_EMAIL: ${PB_TESTUSER_EMAIL:-}
      PB_TESTUSER_PASSWORD: ${PB_TESTUSER_PASSWORD:-}
    volumes:
      - pbdata:/app/pb_data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8090/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

volumes:
  pbdata:
